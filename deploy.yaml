apiVersion: apps/v1
kind: Deployment
metadata:
  name: mci-server
  labels:
    app: mci-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mci-server
  template:
    metadata:
      labels:
        app: mci-server
    spec:
      containers:
        - name: mci-server
          image: mci-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mci-server-service
spec:
  selector:
    app: mci-server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
